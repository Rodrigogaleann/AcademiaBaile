<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Precios | Administración</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/variables.css" />
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/admin.css" />
</head>
<!-- Oculto hasta que admin-estilos.js confirme la sesión con getSession() -->
<!-- Oculto hasta que admin-precios.js confirme la sesión con getSession() -->
<body class="admin" hidden>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="topbar">
    <a class="topbar__logo disp" href="../index.html" style="text-decoration:none">Academia de Baile</a>
    <div class="topbar__der">
      <nav class="topbar__nav" aria-label="Panel"><a href="dashboard.html">Alumnos</a><a href="estilos.html">Estilos</a><a href="precios.html" aria-current="page">Precios</a></nav>
      <div class="topbar__user"><span id="usuario"></span><button class="btn-salir" id="salir" type="button">Cerrar sesión</button></div>
    </div>
  </header>

  <main class="panel">
    <h1 class="panel__titulo disp">Precios</h1>
    <p class="panel__sub">Valores por clase y por mes de cada estilo activo. Los estilos nuevos se crean en la sección Estilos.</p>
    <div class="tabla-wrap">
      <table class="sin-check">
        <thead><tr><th>Estilo</th><th>Precio por clase</th><th>Precio mensual</th><th>Días</th><th>Horarios</th><th>Acciones</th></tr></thead>
        <tbody id="precios"></tbody>
      </table>
      <p id="vacio" hidden></p>
    </div>
    <div class="error" id="aviso" role="alert" hidden></div>
  </main>

  <dialog id="dlg-precio" class="dlg-ancho">
    <form id="form-precio" method="dialog" novalidate>
      <h2 class="disp" id="dlg-titulo">Precios</h2>
      <div class="error" id="form-error" role="alert" hidden></div>
      <div class="fila2">
        <label class="campo">Precio por clase<input name="precio_clase" inputmode="decimal" placeholder="Ej: 8000" /></label>
        <label class="campo">Precio mensual<input name="precio_mensual" inputmode="decimal" placeholder="Ej: 25000" /></label>
      </div>
      <label class="campo">Días de dictado<input name="dias_dictado" maxlength="80" placeholder="Ej: Lunes y miércoles" /></label>
      <label class="campo">Horarios<input name="horarios" maxlength="120" placeholder="Ej: 18:00 a 19:00" /></label>
      <div class="modal__pie">
        <button class="boton boton--sec" type="button" data-cerrar>Cancelar</button>
        <button class="boton" id="guardar" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="../src/js/admin-precios.js"></script>
</body>
</html>
